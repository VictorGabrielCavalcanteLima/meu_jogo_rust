name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust & Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Python utils
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-distutils python3-setuptools

      - name: Setup Android SDK & NDK r21e
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-29 platforms;android-33 build-tools;33.0.0 ndk;21.4.7075529'

      - name: Configure Environment
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/21.4.7075529/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk
        
      - name: Build APK for Android
        run: cargo quad-apk build --release
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-android
          path: target/android/apk/*.apk
