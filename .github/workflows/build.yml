name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust & Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK r25
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-29 platforms;android-33 build-tools;33.0.0 ndk;25.2.9519653'

      - name: Fix NDK symlinks for cargo-quad-apk
        run: |
          BIN_DIR="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd "$BIN_DIR"
          ln -sf llvm-ar arm-linux-androideabi-ar
          ln -sf llvm-ar armv7-linux-androideabi-ar
          ln -sf llvm-ar aarch64-linux-android-ar

      - name: Set NDK_HOME
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk
        
      - name: Build APK for Android
        run: cargo quad-apk build --release
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-android
          path: target/android/apk/*.apk
