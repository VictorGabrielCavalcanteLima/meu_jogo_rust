name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust & Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Python dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-distutils

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk
        
      - name: Build APK for Android
        run: cargo quad-apk build --release
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-android
          path: target/android/apk/*.apk
